[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "opsfeast"
dynamic = ["version"]
description = "Agent-driven IT operations with reusable recipes and a bundled Core Python API"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "tabulate[widechars]==0.10.0"]

[project.optional-dependencies]
execution = ["sshscript @ https://github.com/iapyeh/sshscript/archive/7a3b43594eca50cf1600d4f8a1dc67cb266df19e.tar.gz"]
tui = ["textual==8.2.8"]
