# Inventory descriptor 0.2.0; shared output contract 0.2.0.
descriptor_version: 0.2.0
id: inventory-system
version: 0.2.2
status: implemented
title: System inventory
description: Collect system identity, operating system version, kernel, and architecture.
kind: collection
platforms:
  planned:
  - linux
  - freebsd
  - macos
  - esxi
  implemented:
  - linux
  - freebsd
  - macos
  - esxi
  tested:
  - macos
compatibility:
  sshscript: ==5.0.0
  note: Public 5.0.0 skill snapshot; exact runtime version checked before connection.
dependencies:
  controller:
  - Python >=3.11
  - PyYAML
  - SSHScript ==5.0.0
  target:
  - uname
  - id (when identity sudo is used)
  - ioreg (macOS identity)
  - kenv (FreeBSD identity)
  - esxcli and vmware (ESXi)
  - /bin/sh
  - cat (Linux)
  - freebsd-version (FreeBSD)
  - sw_vers (macOS)
  status: defined
permissions:
  account: login-user
  elevation: optional-root-for-authorized-identity-probes
side_effects:
  target: read-only-queries
  controller: Save raw JSON under observations/ and retain operational observations in records/observations.sqlite3.
inputs:
  required:
  - management-root
  - host-id
  optional:
  - command-timeout-seconds
  note: 'CLI: RECIPE --host HOST --timeout SECONDS; default 30 seconds per connection stage/command, not whole run.'
  variables:
    identity_sudo:
      type: boolean
    command_timeout_seconds:
      type: number
      minimum: 0
      exclusive_minimum: true
output:
  format: json
  schema_version: 0.2.0
  retained_contract_version: 0.1.0
  exchange_version: 0.1.0
  retention_adapter: inventory-system-v1
  example: examples/result.synthetic.json
  fields:
  - hostname
  - platform
  - system_name
  - system_version
  - kernel_name
  - kernel_release
  - architecture
  summary_fields:
  - reason_code
  - message
  - detected_kernel
  - supported_platforms
  run_statuses:
  - success
  - partial
  - failed
  - unsupported
  - skipped
  observation_statuses:
  - success
  - unavailable
  - unsupported
  - permission_denied
  - timeout
  - command_failed
  - parsing_failed
  - not_attempted
verification:
  synthetic_example: examples/result.synthetic.json
  parser_tests: tests/test_inventory_system.py and tests/test_host_runtime.py
  local_execution: Historical recipe 0.2.0, 2026-10-11 macOS local host-init and inventory success; Linux/FreeBSD
    not tested
  ssh_execution: not-tested
implementations:
- id: linux
  version: 0.1.2
  entrypoint: implementations/linux.py
  match:
    os_name: linux
  verification:
    synthetic: tested
    ssh: not-tested
    local: not-tested
- id: freebsd
  version: 0.1.1
  entrypoint: implementations/freebsd.py
  match:
    os_name: freebsd
  verification:
    synthetic: tested
    ssh: not-tested
    local: not-tested
- id: macos
  version: 0.1.1
  entrypoint: implementations/macos.py
  match:
    os_name: macos
  verification:
    synthetic: tested
    ssh: not-tested
    local: 2026-10-11 read-only success
- id: esxi
  version: 0.1.0
  entrypoint: implementations/esxi.py
  match:
    os_name: esxi
  verification:
    synthetic: tested
    ssh: not-tested
    local: not-tested
# Last modified: 2026-10-13
