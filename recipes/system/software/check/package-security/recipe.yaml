{
  "descriptor_version": "0.3.0",
  "author": {
    "name": "Bundle",
    "contacts": [
      "Bundle"
    ]
  },
  "license": "MIT",
  "id": "os-package-security-pipeline",
  "version": "0.3.0",
  "access_mode": "read",
  "title": "Collect packages, acquire vendor advisories and generate a vulnerability report",
  "description": "Host-selected three-stage workflow. Controller downloads official vendor data, reuses fresh Profile snapshots, and saves linked evidence reports. No remediation. FreeBSD VuXML/base SA, Proxmox VE PSA and ESXi VMSA native comparison; unsupported scope remains unknown.",
  "runner": {
    "contract": "python-recipe",
    "version": "0.1.0",
    "entrypoint": "main.py"
  },
  "platforms": {
    "implemented": [
      "linux",
      "freebsd",
      "esxi"
    ],
    "tested": [],
    "planned": []
  },
  "dependencies": {
    "controller": [
      "Python 3.11+",
      "SSHScript 7.0.1",
      "OpsFeast package-security 0.3.0",
      "HTTPS access to official Debian/Canonical/Red Hat/FreeBSD/Proxmox/Broadcom endpoints"
    ],
    "target": [
      "uname; readable native package/platform metadata",
      "Linux/FreeBSD: python3 3.8+ with dpkg-query/rpm/pkg",
      "FreeBSD: freebsd-version; Proxmox VE: pveversion",
      "ESXi 7+: esxcli XML formatter; no target Python required"
    ]
  },
  "permissions": {
    "sudo": false,
    "su": false,
    "controller_https": true
  },
  "side_effects": [
    "Read-only native package queries on selected hosts; no reconnect or privilege changes.",
    "RHEL may read local dnf security metadata with --cacheonly --noplugins; no target network or metadata refresh.",
    "Controller downloads official vendor HTTPS data when no fresh matching Profile cache exists; no network retries.",
    "Controller writes inventory/advisory snapshots, portable retention and HTML/Markdown/JSON report artifacts; no patching."
  ],
  "inputs": {
    "variables": {
      "collection_budget_seconds": {
        "type": "number",
        "default": 180,
        "minimum": 1,
        "maximum": 240
      },
      "command_timeout_seconds": {
        "type": "number",
        "default": 30,
        "minimum": 1,
        "maximum": 120
      },
      "page_size": {
        "type": "integer",
        "default": 200,
        "minimum": 1,
        "maximum": 500
      },
      "declared_ecosystems": {
        "type": "array",
        "default": []
      },
      "advisory_cache_hours": {
        "type": "number",
        "default": 24,
        "minimum": 0,
        "maximum": 168
      },
      "advisory_budget_seconds": {
        "type": "number",
        "default": 180,
        "minimum": 1,
        "maximum": 240
      },
      "redhat_advisory_ids": {
        "type": "array",
        "default": []
      },
      "vendor_advisory_urls": {
        "type": "array",
        "default": [],
        "required": false
      }
    }
  },
  "output": {
    "schema_version": "0.3.0"
  },
  "retention": {
    "contract": "os-package-security-run",
    "version": "0.3.0",
    "mode": "portable",
    "description": "Full OS package inventory plus acquisition-stage and saved vulnerability-report evidence.",
