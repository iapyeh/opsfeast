  "id": "os-package-inventory",
  "title": "Complete OS package database snapshot",
  "description": "Native Linux/Proxmox packages, FreeBSD pkg/base/kernel patch identity and ESXi VIB/component/build/profile metadata; fingerprint checked with explicit partial states. Not an application/container SBOM.",
  "access_mode": "read",
  "runner": {
    "contract": "python-recipe",
    "version": "0.1.0",
    "entrypoint": "main.py"
  },
  "platforms": {
    "implemented": [
      "linux",
      "freebsd",
      "esxi"
    ],
    "tested": [],
    "planned": []
  },
  "dependencies": {
    "controller": [
      "Python 3.11+",
      "SSHScript 7.0.1",
      "OpsFeast package-security 0.2.0"
    ],
    "target": [
      "uname; readable native package/platform metadata",
      "Linux/FreeBSD: python3 3.8+ with dpkg-query/rpm/pkg",
      "FreeBSD: freebsd-version; Proxmox VE: pveversion",
      "ESXi 7+: esxcli XML formatter; no target Python required"
    ]
  },
  "permissions": {
    "sudo": false,
    "su": false
  },
  "side_effects": [
    "Fixed read-only argv/stdin queries on selected hosts; no target writes, package install, network or privilege acquisition.",
    "Controller writes raw and portable retention snapshots."
  ],
  "inputs": {
    "variables": {
      "collection_budget_seconds": {
        "type": "number",
        "default": 180,
        "minimum": 1,
        "maximum": 900
      },
      "command_timeout_seconds": {
        "type": "number",
        "default": 30,
        "minimum": 1,
        "maximum": 120
      },
      "page_size": {
        "type": "integer",
        "default": 200,
        "minimum": 1,
        "maximum": 500
      },
      "declared_ecosystems": {
        "type": "array",
        "default": [],
        "required": false
      }
    }
  },
  "retention": {
    "contract": "os-package-inventory",
    "version": "0.2.0",
    "mode": "portable",
    "description": "OS package snapshot, native identities, fingerprint, timing and completeness.",
