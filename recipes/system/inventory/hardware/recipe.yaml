{
  "descriptor_version": "0.3.0",
  "author": {
    "name": "Bundle",
    "contacts": [
      "Bundle"
    ]
  },
  "license": "MIT",
  "id": "inventory-hardware",
  "version": "0.1.0",
  "title": "Hardware baseline",
  "description": "Independent hardware-baseline observations; partial source/permission coverage remains explicit.",
  "kind": "collection",
  "access_mode": "read",
  "platforms": {
    "implemented": [
      "linux",
      "freebsd",
      "macos",
      "esxi"
    ],
    "tested": [],
    "planned": []
  },
  "runner": {
    "contract": "python-routines",
    "version": "0.1.0",
    "entrypoint": "main.py",
    "finalizer": "finalize",
    "routines": [
      {
        "id": "baseline",
        "function": "baseline",
        "required_permission": "login",
        "properties": [
          "system.architecture",
          "system.virtualization",
          "hardware.cpu_model",
          "hardware.logical_cpus",
          "hardware.memory_total_bytes",
          "hardware.vendor",
          "hardware.model"
        ],
        "depends_on": [],
        "platforms": []
      },
      {
        "id": "identity-unix",
        "function": "identity_unix",
        "required_permission": "login",
        "properties": [
          "hardware.serial",
          "hardware.uuid"
        ],
        "depends_on": [],
        "platforms": [
          "macos",
          "freebsd",
          "esxi"
        ]
      },
      {
        "id": "identity-linux",
        "function": "identity_linux",
        "required_permission": "root",
        "properties": [
          "hardware.serial",
          "hardware.uuid"
        ],
        "depends_on": [],
        "platforms": [
          "linux"
        ]
      }
    ]
  },
  "inputs": {
    "variables": {
      "attention": {
        "type": "object",
        "default": {}
      },
      "collection_budget_seconds": {
        "type": "number",
        "minimum": 0,
        "exclusive_minimum": true,
        "default": 90
      },
      "command_timeout_seconds": {
        "type": "number",
        "minimum": 0,
        "exclusive_minimum": true,
        "default": 30
      }
    }
  },
  "output": {
    "schema_version": "0.1.0"
  },
  "dependencies": {
    "controller": [
      "Python >=3.11",
      "SSHScript ==7.0.1",
      "OpsFeast routines 0.1.0"
    ],
    "target": [
      "Platform-specific inventory tools; unavailable sources remain gaps"
    ]
  },
  "permissions": {
    "routines": "login first; explicit root routines last"
  },
  "side_effects": [
    "Read-only selected probes; controller saves raw/retention evidence and configured consumer receipts."
  ],
  "inventory": {
    "version": "0.1.0",
    "job": "hardware-baseline",
    "properties": [
      "system.architecture",
      "system.virtualization",
      "hardware.cpu_model",
      "hardware.logical_cpus",
      "hardware.memory_total_bytes",
      "hardware.vendor",
      "hardware.model",
      "hardware.serial",
      "hardware.uuid"
    ]
  },
  "retention": {
    "contract": "inventory-routine-observations",
    "version": "0.1.0",
    "description": "Per-recipe inventory with verified per-routine permission evidence and original source times.",
    "schema": "inventory-routine.schema.json"
  }
}
