descriptor_version: 0.3.0
author:
  name: Bundle
  contacts:
  - Bundle
license: MIT
id: inventory-system
version: 0.4.0
status: implemented
title: System inventory
description: Collect bounded system, hardware, storage, network, software and services
  metadata.
kind: collection
platforms:
  planned:
  - linux
  - freebsd
  - macos
  - esxi
  implemented:
  - linux
  - freebsd
  - macos
  - esxi
  tested:
  - macos
compatibility:
  sshscript: ==5.0.0
  note: Public 5.0.0 skill snapshot; exact runtime version checked before connection.
dependencies:
  controller:
  - Python >=3.11
  - PyYAML
  - SSHScript ==5.0.0
  target:
  - /bin/sh
  - uname
  - id
  - head
  - platform-specific tools declared by the property probes
  status: defined
permissions:
  account: login-user
  elevation: verified-root-by-default-unless-account-sudo-disabled
side_effects:
  target: read-only-queries
  controller: Save raw JSON under observations/, retain declared data in retention/
    annual archives, and optionally refresh bundled vault content with an independent
    receipt.
inputs:
  required:
  - management-root
  - host-id
  optional:
  - command-timeout-seconds
  note: Use opsfeast.py inventory query/run or recipes run; no standalone runner.
  variables:
    attention:
      type: object
    collection_budget_seconds:
      type: number
      minimum: 0
      exclusive_minimum: true
    command_timeout_seconds:
      type: number
      minimum: 0
      exclusive_minimum: true
output:
  format: json
  schema_version: 0.3.0
  run_statuses:
  - success
  - partial
  - failed
  - skipped
verification:
  tests:
  - tests/test_inventory_jobs.py
  - tests/test_recipe_runner.py
  local_execution: macOS local selective kernel/architecture query and retention/Vault
    verified
  ssh_execution: not-tested
access_mode: read
collection:
  version: 0.1.0
  catalog: collection.json
  entrypoint: jobs.py
  retention:
    contract: inventory-job-observations
    version: 0.1.0
    description: Per-job standard YANG node references and extension values with source
      times, identity scope and explicit gaps.
    schema: job-retention.schema.json
retention:
  contract: inventory-job-observations
  version: 0.1.0
  description: Per-job standard YANG node references and extension values with source
    times, identity scope and explicit gaps.
  schema: job-retention.schema.json
runner:
  contract: inventory-jobs
  version: 0.1.0
  entrypoint: jobs.py
