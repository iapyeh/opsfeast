{
  "descriptor_version": "0.3.0",
  "author": {
    "name": "Bundle",
    "contacts": [
      "Bundle"
    ]
  },
  "license": "MIT",
  "id": "inventory-overview",
  "version": "0.1.1",
  "execution": {
    "version": "0.1.0",
    "stages": [{"id": "collect", "executor": "python"}]
  },
  "status": "implemented",
  "title": "System inventory meal",
  "description": "Independent inventory recipes; one owned connection, verified login/root phases per host.",
  "kind": "meal",
  "platforms": {
    "planned": [
      "linux",
      "freebsd",
      "macos",
      "esxi"
    ],
    "implemented": [
      "linux",
      "freebsd",
      "macos",
      "esxi"
    ],
    "tested": []
  },
  "compatibility": {
    "sshscript": "==7.0.1",
    "note": "Published sshscript==7.0.1, release source b8d7c8fe88b4096e8a58e6609ba805ee2bf41049; version and package files checked before connection."
  },
  "dependencies": {
    "controller": [
      "Python >=3.11",
      "PyYAML",
      "SSHScript ==7.0.1"
    ],
    "target": [
      "/bin/sh",
      "uname",
      "id",
      "head",
      "platform-specific tools declared by the property probes"
    ],
    "status": "defined"
  },
  "side_effects": {
    "target": "read-only-queries",
    "controller": "Save raw JSON under observations/, retain declared data in retention/ annual archives, and optionally refresh bundled vault content with an independent receipt."
  },
  "inputs": {
    "required": [
      "management-root",
      "host-id"
    ],
    "optional": [
      "command-timeout-seconds"
    ],
    "note": "Use opsfeast.py inventory query/run or recipes run; no standalone runner.",
    "variables": {
      "attention": {
        "type": "object"
      },
      "collection_budget_seconds": {
        "type": "number",
        "minimum": 0,
        "exclusive_minimum": true
      },
      "command_timeout_seconds": {
        "type": "number",
        "minimum": 0,
        "exclusive_minimum": true
      }
    }
  },
  "output": {
    "schema_version": "0.1.0"
  },
  "verification": {
    "tests": [
      "tests/test_routine_meals.py",
      "tests/test_web_inventory_reports.py"
    ],
    "local_execution": "Synthetic transports only for the split/composed contract; no native target validation.",
    "ssh_execution": "not-tested"
  },
  "access_mode": "read",
  "runner": {
    "contract": "recipe-meal",
    "version": "0.1.0",
    "entrypoint": "meal.json"
  },
  "permissions": {
    "routines": "Declared per child; login first and verified root last."
  }
}
