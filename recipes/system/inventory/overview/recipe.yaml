descriptor_version: 0.2.0
author:
  name: Bundle
  contacts:
  - Bundle
license: MIT
id: inventory-system
version: 0.3.2
status: implemented
title: System inventory
description: Collect bounded system, hardware, storage, network, software and services
  metadata.
kind: collection
platforms:
  planned:
  - linux
  - freebsd
  - macos
  - esxi
  implemented:
  - linux
  - freebsd
  - macos
  - esxi
  tested:
  - macos
compatibility:
  sshscript: ==5.0.0
  note: Public 5.0.0 skill snapshot; exact runtime version checked before connection.
dependencies:
  controller:
  - Python >=3.11
  - PyYAML
  - SSHScript ==5.0.0
  target:
  - uname
  - id (when identity sudo is used)
  - ioreg (macOS identity)
  - kenv (FreeBSD identity)
  - esxcli and vmware (ESXi)
  - /bin/sh
  - cat (Linux)
  - freebsd-version (FreeBSD)
  - sw_vers (macOS)
  status: defined
permissions:
  account: login-user
  elevation: verified-root-by-default-unless-account-sudo-disabled
side_effects:
  target: read-only-queries
  controller: Save raw JSON under observations/, retain declared data in retention/
    annual archives, and optionally refresh bundled vault content with an independent
    receipt.
inputs:
  required:
  - management-root
  - host-id
  optional:
  - command-timeout-seconds
  note: 'CLI: RECIPE --host HOST --timeout SECONDS; default 30 seconds per connection
    stage/command, not whole run.'
  variables:
    identity_sudo:
      type: boolean
    collection_budget_seconds:
      type: number
      minimum: 0
      exclusive_minimum: true
    command_timeout_seconds:
      type: number
      minimum: 0
      exclusive_minimum: true
output:
  format: json
  schema_version: 0.2.0
  example: examples/result.synthetic.json
  inventory_contract_version: 0.1.0
  fields:
  - hostname
  - platform
  - system_name
  - system_version
  - kernel_name
  - kernel_release
  - architecture
  summary_fields:
  - reason_code
  - message
  - detected_kernel
  - supported_platforms
  run_statuses:
  - success
  - partial
  - failed
  - unsupported
  - skipped
  observation_statuses:
  - success
  - unavailable
  - unsupported
  - permission_denied
  - timeout
  - command_failed
  - parsing_failed
  - not_attempted
verification:
  synthetic_example: examples/result.synthetic.json
  parser_tests: tests/test_inventory_system.py and tests/test_host_runtime.py
  local_execution: Historical recipe 0.2.0, 2026-10-11 macOS local host-init and inventory
    success; Linux/FreeBSD not tested
  ssh_execution: not-tested
implementations:
- id: linux
  version: 0.1.2
  entrypoint: implementations/linux.py
  match:
    os_name: linux
  verification:
    synthetic: tested
    ssh: not-tested
    local: not-tested
- id: freebsd
  version: 0.1.1
  entrypoint: implementations/freebsd.py
  match:
    os_name: freebsd
  verification:
    synthetic: tested
    ssh: not-tested
    local: not-tested
- id: macos
  version: 0.1.1
  entrypoint: implementations/macos.py
  match:
    os_name: macos
  verification:
    synthetic: tested
    ssh: not-tested
    local: 2026-10-11 read-only success
- id: esxi
  version: 0.1.0
  entrypoint: implementations/esxi.py
  match:
    os_name: esxi
  verification:
    synthetic: tested
    ssh: not-tested
    local: not-tested
access_mode: read
retention:
  contract: inventory-observations
  version: 0.1.0
  description: Allowlisted system inventory observations and native identity evidence.
    Partial/unknown fields and collection scope must be preserved; this dataset is
    not online status or overall health.
  schema: retention.schema.json
