    ],
    "target": [
      "Linux",
      "python3 3.8+ on PATH",
      "Readable standard journald/rsyslog/nginx/MySQL/logrotate configuration; optional journalctl disk-usage access"
    ]
  },
  "permissions": {
    "sudo": false,
    "su": false
  },
  "side_effects": [
    "Read-only fixed queries and bounded configuration reads via the supplied execution account; OS/tool audit records may be produced.",
    "Sudo listing may consult its configured policy/authentication cache; no password, validation request or privileged command is submitted.",
    "No target installation, setting writes, restart, firewall modification or log-content collection.",
    "Controller saves raw/portable retention and independently configured consumer results."
