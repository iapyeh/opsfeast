descriptor_version: 0.3.0
author: {name: Bundle, contacts: [Bundle]}
license: MIT
id: check-port
access_mode: read
retention:
  contract: host-values
  version: 0.2.0
  description: Bounded TCP reachability observations; failure does not identify its cause.
  fields:
    address: {type: string, unit: ip-address, description: Address tested; no assertion of DNS identity}
    port: {type: integer, unit: tcp-port, description: TCP destination port}
    reachable: {type: boolean, unit: "", description: Whether the bounded connection attempt succeeded}
    state: {type: string, unit: "", description: Connection outcome; not overall service health}
version: 0.1.0
title: Check a TCP port from the selected host
description: Connect once to an explicit IP address and port from the selected host; TCP success does not prove application health.
runner:
  contract: python-session
  version: 0.1.0
  entrypoint: main.py
platforms:
  implemented: [linux, freebsd, macos]
  tested: []
  planned: []
dependencies:
  controller: [Python 3.11+, PyYAML 6.0.3, SSHScript 6.0.0]
  target: [python3 on PATH with standard library]
permissions: {sudo: false, su: false}
side_effects:
  - One TCP connection attempt from each selected host to the supplied IP and port.
  - Runner saves raw JSON in the Feast observations directory.
inputs:
  variables:
    port: {type: integer, required: true, minimum: 1, maximum: 65535}
    address: {type: string, default: '127.0.0.1'}
    connect_timeout_seconds: {type: number, default: 3, minimum: 0, exclusive_minimum: true, maximum: 60}
output:
  schema_version: 0.1.0
verification:
  synthetic: tested
  local: not-tested
  ssh: not-tested
